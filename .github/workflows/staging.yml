name: Integration staging
on:
  push:
    branches: [codex/unified-website-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-staging-pages
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: node scripts/verify-payload.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy isolated staging
        id: deployment
        uses: actions/deploy-pages@v4
